<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#34f5ff">
    <title>HackPro - Offline</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: #f8fbff;
            background:
                radial-gradient(circle at 18% 16%, rgba(52,245,255,.16), transparent 28%),
                linear-gradient(180deg, #020617, #04111d);
        }
        main {
            width: min(560px, calc(100% - 32px));
            border: 1px solid rgba(52,245,255,.24);
            border-radius: 8px;
            padding: 28px;
            background: rgba(7,17,31,.9);
            box-shadow: 0 24px 80px rgba(0,0,0,.42);
        }
        img { width: 72px; height: 72px; object-fit: contain; }
        h1 { margin: 18px 0 10px; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
        p { margin: 0; color: #9aa8bd; line-height: 1.7; }
        a {
            display: inline-block;
            margin-top: 22px;
            border-radius: 8px;
            padding: 12px 16px;
            color: #031016;
            background: linear-gradient(135deg, #34f5ff, #4ade80);
            font-weight: 900;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img src="/favicon.svg" alt="HackPro">
        <h1>Internet aloqasi yo'q</h1>
        <p>Platformadagi yangi darslarni ochish uchun internet kerak. Aloqa tiklangandan keyin qayta urinib ko'ring.</p>
        <a href="/platform">Qayta urinish</a>
    </main>
</body>
</html>
