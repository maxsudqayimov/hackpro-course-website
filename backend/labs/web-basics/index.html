<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HackPro Safe Lab</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #040a12; color: #eef7ff; --cyan:#39d8ff; --mint:#50e3c2; --line:#1d3548; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #143a5c 0, transparent 34%), #040a12; }
      header { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:70px; padding:12px clamp(18px,4vw,54px); border-bottom:1px solid var(--line); background:#06101be8; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:900; letter-spacing:.05em; }
      .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; color:#04111d; background:linear-gradient(135deg,var(--cyan),var(--mint)); }
      .status { color:var(--mint); font-size:12px; }
      main { width:min(1180px,calc(100% - 32px)); margin:32px auto 70px; }
      .mission { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:26px; padding:28px; border:1px solid #1b5773; border-radius:22px; background:#071522e8; }
      small { color:var(--cyan); font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
      h1 { margin:9px 0 12px; font-size:clamp(30px,6vw,58px); }
      p { color:#a9bed0; line-height:1.7; }
      .timer { min-width:150px; padding:18px; border:1px solid var(--line); border-radius:16px; text-align:center; }
      .timer strong { display:block; margin-top:7px; color:var(--mint); font-size:28px; }
      .workspace { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr); gap:20px; margin-top:20px; }
      .terminal,.answer { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#06111c; }
      .panel-head { display:flex; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line); color:#8fa7ba; font-size:12px; }
      #output { height:390px; overflow:auto; margin:0; padding:18px; white-space:pre-wrap; color:#cfe9dc; font:13px/1.7 Consolas,monospace; }
      .command-row { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
      .prompt { padding-top:11px; color:var(--mint); font:700 13px Consolas,monospace; }
      input { min-width:0; flex:1; min-height:42px; padding:0 12px; border:1px solid #243e52; border-radius:9px; color:#fff; background:#030910; outline:none; }
      input:focus { border-color:var(--cyan); }
      button { min-height:42px; padding:0 16px; border:0; border-radius:9px; color:#04111d; background:linear-gradient(135deg,var(--cyan),var(--mint)); font-weight:900; cursor:pointer; }
      .answer { padding:24px; }
      .answer h2 { margin:8px 0 10px; }
      .answer label { display:grid; gap:8px; margin:22px 0 12px; font-size:12px; font-weight:800; }
      .answer label input { width:100%; }
      #result { margin-top:15px; padding:13px; border:1px solid var(--line); border-radius:10px; color:#c0d2df; line-height:1.55; }
      #result.passed { color:#8df2dd; border-color:#2c7a68; background:#0b2a252e; }
      .commands { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
      .commands code { display:block; margin:8px 0; color:#8eb7cb; overflow-wrap:anywhere; }
      @media(max-width:800px){.mission,.workspace{grid-template-columns:1fr}.timer{min-width:0;text-align:left}#output{height:300px}.command-row{display:grid;grid-template-columns:auto 1fr}.command-row button{grid-column:1/-1}}
    </style>
  </head>
  <body>
    <header><div class="brand"><span class="mark">HP</span>HackPro Safe Lab</div><div class="status">● Izolyatsiyalangan muhit</div></header>
    <main>
      <section class="mission"><div><small id="category">LAB</small><h1 id="title">Laboratoriya yuklanmoqda…</h1><p id="briefing"></p></div><div class="timer"><small>Qolgan vaqt</small><strong id="timer">30:00</strong></div></section>
      <section class="workspace">
        <div class="terminal"><div class="panel-head"><span>hackpro@safe-lab</span><span>simulated terminal</span></div><pre id="output">HackPro laboratoriyasi tayyor. Buyruqlarni ko‘rish uchun help yozing.</pre><form class="command-row" id="terminal-form"><span class="prompt">$</span><input id="command" autocomplete="off" aria-label="Terminal buyrug‘i" /><button type="submit">Bajarish</button></form></div>
        <aside class="answer"><small>Maqsad</small><h2>Topshiriq</h2><p id="objective"></p><label>Javob<input id="answer" autocomplete="off" /></label><button id="check" type="button">Javobni tekshirish</button><div id="result">Dalillarni terminal orqali yig‘ing.</div><div class="commands"><small>Tavsiya etilgan buyruqlar</small><div id="commands"></div></div></aside>
      </section>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get('token') || '';
      const base = location.pathname.endsWith('/') ? location.pathname : `${location.pathname}/`;
      const endpoint = (path) => `${base}${path}?token=${encodeURIComponent(token)}`;
      const output = document.querySelector('#output');
      const result = document.querySelector('#result');
      const append = (text) => { output.textContent += `\n${text}`; output.scrollTop = output.scrollHeight; };
      fetch(endpoint('api/scenario')).then((response) => response.json()).then(({ scenario, availableCommands }) => {
        document.title = `${scenario.title} — HackPro Safe Lab`;
        document.querySelector('#category').textContent = scenario.category;
        document.querySelector('#title').textContent = scenario.title;
        document.querySelector('#briefing').textContent = scenario.briefing;
        document.querySelector('#objective').textContent = scenario.objective;
        document.querySelector('#commands').innerHTML = availableCommands.map((command) => `<code>${command.replaceAll('<','&lt;')}</code>`).join('');
      }).catch(() => { result.textContent = 'Laboratoriya ma’lumoti yuklanmadi.'; });
      document.querySelector('#terminal-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const input = document.querySelector('#command');
        const command = input.value.trim();
        if (!command) return;
        append(`$ ${command}`); input.value = '';
        const response = await fetch(endpoint('api/command'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ command }) });
        const payload = await response.json();
        if (payload.clear) output.textContent = '';
        else append(payload.output || payload.error || 'Xatolik');
      });
      document.querySelector('#check').addEventListener('click', async () => {
        const answer = document.querySelector('#answer').value;
        const response = await fetch(endpoint('api/check'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ answer }) });
        const payload = await response.json();
        result.className = payload.passed ? 'passed' : '';
        result.textContent = payload.passed ? `✓ ${payload.message}${payload.awardedXp ? ` +${payload.awardedXp} XP` : ''}` : `${payload.message}${payload.hint ? ` Maslahat: ${payload.hint}` : ''}`;
      });
      let seconds = 30 * 60;
      setInterval(() => { seconds = Math.max(0, seconds - 1); document.querySelector('#timer').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
    </script>
  </body>
</html>
